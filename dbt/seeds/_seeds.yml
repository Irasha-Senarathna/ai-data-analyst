version: 2

seeds:
  - name: brazil_states
    description: >
      One row per Brazilian state (27 UFs) with its macro-region and capital. The capital's
      coordinates are where weather is measured. The region drives row-level security.
    columns:
      - name: state
        description: Two-letter state code (UF).
        data_tests: [unique, not_null]
      - name: state_name
        description: Full state name.
      - name: region
        description: Brazilian macro-region.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]
      - name: capital
        description: State capital city.
      - name: latitude
        description: Capital latitude.
      - name: longitude
        description: Capital longitude.

  - name: brazil_holidays
    description: Brazilian national holidays and widely observed optional days, 2016-09 to 2018-10.
    config:
      column_types:
        holiday_date: date
    columns:
      - name: holiday_date
        description: The holiday.
        data_tests: [unique, not_null]
      - name: holiday_name
        description: Holiday name in English.
      - name: holiday_type
        description: national (legal holiday) or optional (ponto facultativo, widely observed).
        data_tests:
          - accepted_values:
              arguments:
                values: [national, optional]
