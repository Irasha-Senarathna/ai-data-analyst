[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Ask your data: an AI agent that answers business questions with read-only SQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13.27",
    "dagster-webserver>=1.13.27",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "dbt", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^web/", "^dbt/", "^\\.claude/"]
